; Smart Room Energy Management firmware
; Build:   pio run -e uno_wifi_rev2      (or -e esp32dev)
; Upload:  pio run -e uno_wifi_rev2 -t upload
; Monitor: pio device monitor
; Tests:   pio test -e native           (control logic, runs on your PC)

[platformio]
default_envs = uno_wifi_rev2

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/DFRobot/DFRobot_INA219.git

[env:uno_wifi_rev2]
platform = atmelmegaavr
board = uno_wifi_rev2
lib_deps =
    ${env.lib_deps}
    arduino-libraries/WiFiNINA@^1.8.14

[env:esp32dev]
platform = espressif32
board = esp32dev

; Hardware-free unit tests for lib/room_logic
[env:native]
platform = native
framework =
lib_deps =
test_framework = unity
build_flags = -std=c++11
